# Shakmuran GitHub Action CI/CD Pipline
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t defectdojo .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Yandex.Cloud
        run: |
          yc managed-postgresql cluster create --name defectdojo-db
          docker tag defectdojo cr.yandex/<registry-id>/defectdojo
          docker push cr.yandex/<registry-id>/defectdojo

- name: Run Bandit
  run: |
    pip install bandit
    bandit -r defectdojo/ 

    - name: Run OWASP ZAP
  run: |
    docker run -v $(pwd):/zap/wrk/:rw -t owasp/zap2docker-stable zap-baseline.py -t http://localhost:8000

- name: Run Trivy
  run: |
    docker run --rm aquasec/trivy image defectdojo

    - uses: GitGuardian/gg-shield-action@v1
  with:
    api-key: ${{ secrets.GITGUARDIAN_API_KEY }}

if: failure()
run: exit 1  # Остановит пайплайн при ошибках безопасности

- uses: actions/github-script@v6
  with:
    script: |
      github.rest.issues.createComment({
        body: "Обнаружены уязвимости. Исправьте их перед слиянием."
      })
    
    
