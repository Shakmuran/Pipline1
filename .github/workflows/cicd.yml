# Shakmuran GitHub Action CI/CD Pipline
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t defectdojo .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Yandex.Cloud
        run: |
          yc managed-postgresql cluster create --name defectdojo-db
          docker tag defectdojo cr.yandex/<registry-id>/defectdojo
          docker push cr.yandex/<registry-id>/defectdojo
