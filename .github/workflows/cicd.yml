# Shakmuran GitHub Action CI/CD Pipline
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t juice-shop .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Yandex Cloud
        uses: yc-actions/yc-kubernetes-deploy@v1
        with:
          yc-sa-json: ${{ secrets.YC_SA_JSON }}
          cluster-name: juice-shop-cluster
          namespace: default
          manifest: k8s/deployment.yaml

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run ESLint
        run: npx eslint .
      - name: Run Semgrep
        run: npx semgrep --config=auto .
      - name: Check dependencies
        run: npm audit

          dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run OWASP ZAP
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: http://localhost:3000
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image: juice-shop

            security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Scan for secrets
        uses: GitGuardian/gg-shield-action@v1
        with:
          api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
      - name: Check configurations
        run: checkov -d .

          security-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on vulnerabilities
        if: failure()
        run: exit 1
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Обнаружены уязвимости! См. отчеты SAST/DAST."
            });
